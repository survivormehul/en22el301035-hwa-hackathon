<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Happy While Away</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">Happy <span class="brand-accent">While Away</span></a>
      <nav class="main-nav">
        <a href="shop.html">Shop</a>
        <a href="subscription.html">Subscription</a>
        <a href="cart.html" class="nav-cart" id="nav-cart">Cart <span id="cart-count">0</span></a>
        <button class="nav-toggle" id="nav-toggle" aria-label="Open menu">&#9776;</button>
      </nav>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <h1>Checkout</h1>
      <p>Enter your details to place your order.</p>
    </div>
  </section>

  <section class="checkout-section">
    <div class="container checkout-inner">
      <form id="checkout-form" class="checkout-form">
        <div class="form-grid">
          <div class="form-field">
            <label>Full Name</label>
            <input type="text" name="name" required placeholder="Rohan Sharma">
          </div>
          <div class="form-field">
            <label>Email</label>
            <input type="email" name="email" required placeholder="rohan@example.com">
          </div>
          <div class="form-field">
            <label>Phone</label>
            <input type="tel" name="phone" required placeholder="+91 98765 43210">
          </div>
          <div class="form-field full">
            <label>Address</label>
            <input type="text" name="address" required placeholder="House no., street, locality">
          </div>
          <div class="form-field">
            <label>City</label>
            <input type="text" name="city" required placeholder="Mumbai">
          </div>
          <div class="form-field">
            <label>Pincode</label>
            <input type="text" name="pincode" required placeholder="400001">
          </div>
        </div>
        <div class="order-total">
          <span>Order total</span>
          <strong id="checkout-total">₹0.00</strong>
        </div>
        <button type="submit" class="btn btn-primary btn-large">Place Order</button>
      </form>
      <div class="checkout-items">
        <h3>Your order</h3>
        <div id="checkout-items"></div>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <a href="index.html" class="brand">Happy <span class="brand-accent">While Away</span></a>
        <p>Premium dog enrichment, delivered regularly.</p>
      </div>
      <div class="footer-links">
        <div><a href="shop.html">Shop</a></div>
        <div><a href="subscription.html">Subscription</a></div>
        <div><a href="cart.html">Cart</a></div>
        <div><a href="#">Contact</a></div>
      </div>
      <div class="footer-copy">
        <p>&copy; 2026 Happy While Away. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initCheckout();
    });
  </script>
</body>
</html>
